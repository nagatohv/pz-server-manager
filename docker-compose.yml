services:
  pz-portal:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Exposición del puerto Web HTTP adaptada para Dokploy:
      # En producción con Dokploy, Traefik o Nginx Proxy Manager se comunican mediante la red Docker
      # usando el puerto interno (EXPOSE 3000/3001 del contenedor), sin necesidad de publicar el puerto en el Host.
      # Si deseas publicar el puerto directamente al Host (para desarrollo local), define en el .env:
      # WEB_PORT_HOST=3001
      - "${WEB_PORT_HOST:+$WEB_PORT_HOST:}${PORT:-3001}"
      # --- PUERTOS DE CONEXIÓN DE JUEGO (UDP) ---
      # Project Zomboid requiere abrir estos puertos UDP directamente en el host
      - "16261:16261/udp" # Puerto principal del servidor de juego
      - "16262:16262/udp" # Puerto de conexión directa de los clientes
      - "8766:8766/udp" # Puerto Steam Query

    environment:
      - PORT=${PORT:-3001}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_NAME=${SERVER_NAME:-servertest}
      - JVM_MIN_GB=${JVM_MIN_GB:-4}
      - JVM_MAX_GB=${JVM_MAX_GB:-8}
      - STEAMAPPBRANCH=${STEAMAPPBRANCH}
      - DATA_DIR=${DATA_DIR:-/home/steam/data}

    volumes:
      # Volumen persistente para guardar partidas, configuraciones y la descarga de SteamCMD
      - pz-data:/home/steam/data

volumes:
  pz-data:

